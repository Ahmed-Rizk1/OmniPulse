services:
  redis:
    image: redis:7.4-alpine
    container_name: omnipulse_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: omnipulse_backend
    restart: unless-stopped
    environment:
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_ENV=${APP_ENV:-development}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend/app:/app/app
      - ./alembic:/app/alembic
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: omnipulse_worker
    restart: unless-stopped
    command: python -m app.worker
    environment:
      - SUPABASE_DB_URL=${SUPABASE_DB_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - APP_ENV=${APP_ENV:-development}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend/app:/app/app
      - ./alembic:/app/alembic
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE_URL=/api
        - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL:-https://otiqrfyewjvmxaqrankl.supabase.co}
        - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-mock-anon-key}
    container_name: omnipulse_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL:-https://otiqrfyewjvmxaqrankl.supabase.co}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-mock-anon-key}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    container_name: omnipulse_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
